spring.application.name=accounting-manager-api-test

spring.datasource.url=jdbc:h2:mem:accountingdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=secret-key
jwt.issuer=login-service
jwt.public=/**

services.sales.base-url=http://localhost:8082/api/v1/sales
services.invoices.base-url=http://localhost:8087/api/v1/invoices
services.users.base-url=http://localhost:8081/api/v1/users